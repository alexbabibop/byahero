name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair missing platform files (scaffold was manual)
        run: |
          rm -rf android
          flutter create . --org com.alexbabibop --project-name byahero --platforms android

      - name: Bump compileSdk to 36 (plugins require 36)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk.*/compileSdk = 36/' android/app/build.gradle.kts
            grep -n "compileSdk" android/app/build.gradle.kts || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion.*/compileSdkVersion 36/' android/app/build.gradle
            grep -n "compileSdk" android/app/build.gradle || true
          fi
          if [ -f android/build.gradle.kts ]; then
            grep -n "compileSdk\|agp" android/build.gradle.kts || true
          fi

      - name: Inject Android permissions (regenerated manifest wipes them)
        run: |
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          assert p.exists(), "manifest missing"
          t = p.read_text()
          perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_BACKGROUND_LOCATION",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.CAMERA",
          ]
          add = "".join(f'\n    <uses-permission android:name="{x}" />' for x in perms if x not in t)
          t, n = re.subn(r"(<manifest[^>]*>)", r"\1" + add, t, count=1)
          assert n == 1, "manifest tag not found"
          p.write_text(t)
          print("permissions injected")
          EOF
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml || true

      - name: Create google-services.json from secret (optional)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          fi

      - name: pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release --dart-define=MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: byahero-apk
          path: build/app/outputs/flutter-apk/app-release.apk
