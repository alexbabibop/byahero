name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair missing platform files (scaffold was manual)
        run: |
          rm -rf android
          flutter create . --org com.alexbabibop --project-name byahero --platforms android

      - name: Bump compileSdk to 36 (plugins require 36)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk.*/compileSdk = 36/' android/app/build.gradle.kts
            grep -n "compileSdk" android/app/build.gradle.kts || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion.*/compileSdkVersion 36/' android/app/build.gradle
            grep -n "compileSdk" android/app/build.gradle || true
          fi
          if [ -f android/build.gradle.kts ]; then
            grep -n "compileSdk\|agp" android/build.gradle.kts || true
          fi

      - name: Inject Android permissions (regenerated manifest wipes them)
        run: |
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          assert p.exists(), "manifest missing"
          t = p.read_text()
          perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_BACKGROUND_LOCATION",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.CAMERA",
          ]
          add = "".join(f'\n    <uses-permission android:name="{x}" />' for x in perms if x not in t)
          t, n = re.subn(r"(<manifest[^>]*>)", r"\1" + add, t, count=1)
          assert n == 1, "manifest tag not found"
          p.write_text(t)
          print("permissions injected")
          EOF
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml || true

      - name: Create google-services.json from secret (optional)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          fi

      - name: Apply google-services Gradle plugin (only with secret)
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "no secret, skipping"
            exit 0
          fi
          python3 - <<'EOF'
          import pathlib
          s = pathlib.Path("android/settings.gradle.kts")
          if s.exists():
              t = s.read_text()
              if "google-services" not in t:
                  t = t.replace("plugins {", 'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false', 1)
                  s.write_text(t)
                  print("settings patched")
          a = pathlib.Path("android/app/build.gradle.kts")
          if a.exists():
              t = a.read_text()
              if '"com.google.gms.google-services"' not in t and "'com.google.gms.google-services'" not in t:
                  t = t.replace("plugins {", 'plugins {\n    id("com.google.gms.google-services")', 1)
                  a.write_text(t)
                  print("app patched")
          EOF

      # OPTIONAL pero ito ang ginagawang permanent ang SHA-1 ng app.
      # Kapag wala, gumagamit ang debug key ng runner (bago-bago ang SHA-1,
      # kaya hindi tuloy-tuloy ang Google Sign-In).
      - name: Create signing keystore from secret (optional)
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::notice::Walang ANDROID_KEYSTORE_BASE64 - debug signing ang gagamitin (SHA-1 = pabagu-bago)."
            exit 0
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          python3 .github/ci/patch_keystore.py
          grep -n "signingConfig\|storeFile" android/app/build.gradle.kts || true
        env:
          KS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}

      - name: pub get
        run: flutter pub get

      - name: Analyze (errors only fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Print APK SHA-1/SHA-256 (iregister sa Firebase para sa Google Sign-In)
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | tail -1)
          "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk 2>/dev/null \
            | grep -Ei "SHA-1|SHA-256" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: byahero-apk
          path: build/app/outputs/flutter-apk/app-release.apk
